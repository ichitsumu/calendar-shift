<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>calendar-shift</title>
  <meta name="description" content="予定とマーク、家の予約可能時間を一目で確認できる月カレンダー">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --accent: #7c3aed;
      --accent2: #db2777;
      --blue: #2563eb;
      --red: #dc2626;
      --text: #111827;
      --muted: #6b7280;
      --dim: #9ca3af;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      min-height: 100svh;
      color: var(--text);
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden;
      position: fixed;
      width: 100%;
      /* top は JS で動的にセット (scrollY 保存) */
    }

    /* ─── Layout ─────────────────────────────── */
    .app {
      max-width: 430px;
      margin: 0 auto;
      padding: 20px 14px max(40px, env(safe-area-inset-bottom));
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
    }

    /* ─── Month nav ───────────────────────────── */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      padding-top: 10px;
    }

    .nav-btn {
      background: rgba(255,255,255,0.09);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn:active {
      background: rgba(167,139,250,0.25);
      transform: scale(0.92);
    }


    .month-label {
      font-size: 14px;
      font-weight: 700;
      min-width: 100px;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .mark-legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--dim);
    }

    .legend-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      line-height: 1;
    }

    /* ─── Calendar card ───────────────────────── */
    .calendar-card {
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--card-border);
      background: #f9fafb;
    }

    .wd {
      text-align: center;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .wd.sun { color: var(--red); }
    .wd.sat { color: var(--blue); }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      padding: 6px 4px;
    }

    .day-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3px 1px 2px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      min-height: 50px;
      transition: border-color 0.15s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      background: #fff;
    }

    .day-cell.empty { cursor: default; pointer-events: none; border-color: transparent; background: transparent; }

    .day-cell:not(.empty):active { transform: scale(0.93); }

    .day-cell.selected {
      border-color: var(--accent);
      border-width: 1.5px;
    }



    .day-num {
      font-size: 12px;
      font-weight: 500;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 50%;
    }

    .day-cell.sun .day-num { color: var(--red); }
    .day-cell.sat .day-num { color: var(--blue); }


    .day-marks {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1px;
      margin-top: 1px;
    }

    .dm-dot { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; font-weight: 700; line-height: 1; }
    .dm-more  { font-size: 8px; color: var(--dim); font-weight: 700; margin-left: 2px; }

    .ft-dot {
      font-size: 7px;
      margin-top: 1px;
      opacity: 0.65;
    }

    /* ─── Day panel ───────────────────────────── */
    .day-panel {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
      transition: all 0.3s;
      min-height: 100px;
    }

    .panel-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 18px;
    }

    .panel-date {
      font-size: 18px;
      font-weight: 700;
    }

    .panel-day-name {
      font-size: 12px;
      color: var(--muted);
    }

    .sec-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .empty-hint {
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 14px;
    }

    /* ─── Mark chips ──────────────────────────── */
    .marks-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .chip-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .mark-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #f3f4f6;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 12px 6px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s;
      -webkit-tap-highlight-color: transparent;
    }

    .mark-chip:active { transform: scale(0.94); }

    .chip-del { color: var(--red); font-size: 13px; margin-left: 3px; opacity: 0.8; }

    .ft-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .ft-time { font-size: 14px; font-weight: 700; color: var(--blue); }
    .ft-dur  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .ft-del {
      color: var(--red);
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
      opacity: 0.7;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .ft-del:active { opacity: 1; }

    .action-row { display: flex; gap: 10px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.18s;
      border: none;
      flex: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.96); }

    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-secondary { background: #eff6ff; border: 1px solid #bfdbfe; color: var(--blue); }
    .btn-outline  { background: #f3f4f6; border: 1px solid var(--card-border); color: var(--muted); }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.open { display: flex; animation: fadeIn 0.2s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .sheet {
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 20px 20px 0 0;
      padding: 8px 20px max(40px, env(safe-area-inset-bottom));
      width: 100%;
      max-width: 430px;
      animation: slideUp 0.28s cubic-bezier(0.25,0.46,0.45,0.94);
      max-height: 90vh;
      max-height: 90svh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      background: #d1d5db;
      border-radius: 2px;
      margin: 10px auto 18px;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 18px;
      color: var(--text);
    }

    .mark-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }

    .mark-opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 4px 8px;
      background: #f9fafb;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    .mark-opt:active { transform: scale(0.93); }
    .mark-opt.selected { background: #ede9fe; border-color: var(--accent); }
    .mark-opt .mo-dot { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 2px; font-size: 18px; line-height: 1; }
    .mark-opt .mo-label { font-size: 10px; color: var(--muted); text-align: center; line-height: 1.3; }

    .time-form { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .form-row  { display: flex; align-items: center; gap: 12px; }
    .form-lbl  { font-size: 13px; color: var(--muted); width: 46px; flex-shrink: 0; }

    .sel-time-wrap { flex: 1; display: flex; align-items: center; gap: 6px; }

    .sel-time {
      flex: 1;
      background: #f9fafb;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 10px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      appearance: none;
      -webkit-appearance: none;
      text-align: center;
      cursor: pointer;
    }

    .sel-time:focus { outline: none; border-color: var(--accent); }
    .sel-colon { font-size: 18px; font-weight: 700; color: var(--muted); }
    .sec-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 8px; }
    .empty-hint { font-size: 12px; color: var(--dim); margin-bottom: 12px; }
    .marks-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .no-select-msg { text-align: center; color: var(--dim); font-size: 13px; padding: 16px 0; }


    /* ── Free time overview card ── */
    .ft-ov-card {
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .ft-ov-header {
      font-size: 10px;
      font-weight: 700;
      color: var(--dim);
      margin-bottom: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .ft-ov-empty { font-size: 12px; color: var(--dim); text-align: center; padding: 16px 0; grid-column: 1 / -1; }

    #ft-overview-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .ft-row {
      padding: 4px 6px;
      position: relative;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      border-bottom: 1px dashed var(--card-border);
    }
    
    .ft-row:last-child {
      border-bottom: none;
    }

    .ft-row-date {
      color: var(--accent);
      margin-right: 2px;
      display: inline-block;
      width: 52px;
      flex-shrink: 0;
      text-align: right;
    }
    .ft-del {
      margin-left: auto;
      font-size: 11px;
      color: var(--red);
      opacity: 0.6;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      padding: 2px 4px;
    }

    .sheet::-webkit-scrollbar { width: 4px; }
    .sheet::-webkit-scrollbar-track { background: transparent; }
    .sheet::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
  </style>
</head>
<body>

<div class="app">

  <!-- Month Navigation -->
  <div class="month-nav">
    <button class="nav-btn" id="btn-prev" aria-label="前の月">◀</button>
    <span class="month-label" id="month-label"></span>
    <button class="nav-btn" id="btn-next" aria-label="次の月">▶</button>
  </div>

  <!-- Mark Legend -->
  <div class="mark-legend" id="mark-legend"></div>

  <!-- Calendar Card -->
  <div class="calendar-card" aria-label="カレンダー">
    <div class="weekdays">
      <span class="wd sun">日</span>
      <span class="wd">月</span>
      <span class="wd">火</span>
      <span class="wd">水</span>
      <span class="wd">木</span>
      <span class="wd">金</span>
      <span class="wd sat">土</span>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <!-- Free Time Overview -->
  <div class="ft-ov-card">
    <div class="ft-ov-header">家の予約可能時間一覧</div>
    <div id="ft-overview-list"></div>
  </div>

</div>

<!-- ── Modal: Day Edit ────────────────── -->
<div class="overlay" id="modal-day" role="dialog" aria-label="日付編集">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="day-modal-title"></div>
    
    <div class="sec-title">マーク</div>
    <div class="mark-grid" id="day-mark-grid"></div>

    <div class="sec-title" style="margin-top:20px;">時間</div>
    <div class="time-form">
      <div class="form-row">
        <span class="form-lbl">開始</span>
        <div class="sel-time-wrap">
          <select class="sel-time" id="sel-start-h" aria-label="開始時（時）"></select>
          <span class="sel-colon">:</span>
          <select class="sel-time" id="sel-start-m" aria-label="開始時（分）">
            <option value="00">00</option>
            <option value="15">15</option>
            <option value="30">30</option>
            <option value="45">45</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <span class="form-lbl">終了</span>
        <div class="sel-time-wrap">
          <select class="sel-time" id="sel-end-h" aria-label="終了時（時）"></select>
          <span class="sel-colon">:</span>
          <select class="sel-time" id="sel-end-m" aria-label="終了時（分）">
            <option value="00">00</option>
            <option value="15">15</option>
            <option value="30">30</option>
            <option value="45">45</option>
          </select>
        </div>
      </div>
    </div>
    
    <div class="action-row" style="margin-top: 20px;">
      <button class="btn btn-outline" id="btn-clear-day" style="flex:0.5; color:var(--red);">クリア</button>
      <button class="btn btn-primary" id="btn-save-day" style="flex:1;">保存する</button>
    </div>
    <br>
    <button class="btn btn-outline" onclick="closeModal('modal-day')" style="width:100%">キャンセル</button>
  </div>
</div>


<script>
  /* ═══════════════════════════════════════════
     CONSTANTS
  ═══════════════════════════════════════════ */
  const PRESET_MARKS = [
    { id: 'p0', color: 'transparent', name: '\u5E97', icon: '\uD83D\uDD14', textColor: '#ef4444' },
    { id: 'p1', color: 'transparent', name: '\u5BB6', icon: '\uD83C\uDFE0', textColor: '#f59e0b' },
    { id: 'p2', color: 'transparent', textColor: '#ef4444', name: '\u4F11', icon: '\u2715' },
  ];

  const STORAGE_KEY = 'calendar-shift-v2';
  const CUSTOM_MAX = 5;

  const DAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];

  /* ═══════════════════════════════════════════
     STATE
  ═══════════════════════════════════════════ */
  const now = new Date();
  let curYear  = now.getFullYear();
  let curMonth = now.getMonth();   // 0-indexed
  let selDate  = null;             // "YYYY-MM-DD"

  let db = {
    marks:       {},   // { "YYYY-MM-DD": [{ id, color, name }, ...] }
    freeTimes:   {}    // { "YYYY-MM-DD": [{ start: "10:00", end: "12:00" }] }
  };

  /* ═══════════════════════════════════════════
     STORAGE
  ═══════════════════════════════════════════ */
  function load() {
    try {
      const s = localStorage.getItem(STORAGE_KEY);
      if (s) db = JSON.parse(s);
    } catch(e) {}
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e) {}
  }

  /* ═══════════════════════════════════════════
     HELPERS
  ═══════════════════════════════════════════ */
  function toKey(y, m, d) {
    return `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function todayKey() {
    const t = new Date();
    return toKey(t.getFullYear(), t.getMonth(), t.getDate());
  }

  function calcDur(s, e) {
    const [sh, sm] = s.split(':').map(Number);
    const [eh, em] = e.split(':').map(Number);
    const min = (eh * 60 + em) - (sh * 60 + sm);
    if (min <= 0) return '';
    const h = Math.floor(min / 60), m = min % 60;
    if (h === 0) return `${m}分`;
    if (m === 0) return `${h}時間`;
    return `${h}時間${m}分`;
  }

  function parseDate(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function renderLegend() {
    const lg = document.getElementById('mark-legend');
    lg.innerHTML = '';
    PRESET_MARKS.forEach(mk => {
      const dotStyle = mk.icon 
        ? `background:transparent; color:${mk.textColor};` 
        : `background-color:${mk.color};`;
      const inner = mk.icon || '';
      lg.innerHTML += `<div class="legend-item"><span class="legend-dot" style="${dotStyle}">${inner}</span><span>${mk.name}</span></div>`;
    });
  }

  /* ═══════════════════════════════════════════
     RENDER CALENDAR
  ═══════════════════════════════════════════ */
  function renderCalendar() {
    document.getElementById('month-label').textContent =
      `${curYear}年${curMonth + 1}月`;

    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    const today  = todayKey();
    const first  = new Date(curYear, curMonth, 1).getDay();
    const days   = new Date(curYear, curMonth + 1, 0).getDate();

    // Empty padding cells
    for (let i = 0; i < first; i++) {
      const el = document.createElement('div');
      el.className = 'day-cell empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= days; d++) {
      const key = toKey(curYear, curMonth, d);
      const dow = (first + d - 1) % 7;  // 0=Sun, 6=Sat

      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dow === 0) cell.classList.add('sun');
      if (dow === 6) cell.classList.add('sat');
      if (key === selDate) cell.classList.add('selected');
      cell.dataset.date = key;

      // Day number
      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d;
      cell.appendChild(num);

      // Mark color dots
      const marks = db.marks[key] || [];
      if (marks.length > 0) {
        const row = document.createElement('div');
        row.className = 'day-marks';
        marks.slice(0, 3).forEach(m => {
          const s = document.createElement('div');
          s.className = 'dm-dot';
          if (m.icon) {
            s.style.backgroundColor = 'transparent';
            s.style.color = m.textColor || '#ef4444';
            s.textContent = m.icon;
          } else {
          s.style.backgroundColor = m.color || '#9ca3af';
          }
          row.appendChild(s);
        });
        if (marks.length > 3) {
          const more = document.createElement('span');
          more.className = 'dm-more';
          more.textContent = `+${marks.length - 3}`;
          row.appendChild(more);
        }
        cell.appendChild(row);
      }


      cell.addEventListener('click', () => selectDate(key));
      grid.appendChild(cell);
    }
  }

  /* ═══════════════════════════════════════════
     SELECT DATE & RENDER PANEL
  ═══════════════════════════════════════════ */
  let tempMark = null;

  function selectDate(key) {
    selDate = key;
    renderCalendar();
    renderPanel();
    openModal('modal-day');
  }

  function renderPanel() {
    if (!selDate) return;

    const d     = parseDate(selDate);
    const dow   = d.getDay();
    const isSun = dow === 0;
    const isSat = dow === 6;
    const color = isSun ? 'var(--red)' : isSat ? 'var(--blue)' : 'var(--text)';
    const [, m, day] = selDate.split('-').map(Number);
    
    // タイトル
    document.getElementById('day-modal-title').innerHTML =
      `<span style="color:${color}">${m}月${day}日</span> <span style="font-size:14px;color:var(--muted);font-weight:400">（${DAY_NAMES[dow]}）</span>`;

    // 既存データの読み込み
    const existingMark = db.marks[selDate] && db.marks[selDate][0];
    tempMark = existingMark || null;

    // マークグリッド
    const grid = document.getElementById('day-mark-grid');
    grid.innerHTML = '';
    PRESET_MARKS.forEach(mk => {
      const el = document.createElement('div');
      el.className = 'mark-opt';
      if (tempMark && tempMark.id === mk.id) el.classList.add('selected');
      const dotStyle = mk.icon 
        ? `background:transparent; color:${mk.textColor}; font-size:18px; display:flex; align-items:center; justify-content:center; line-height:1;` 
        : `background-color:${mk.color || '#9ca3af'};`;
      const inner = mk.icon || '';
      el.innerHTML = `<span class="mo-dot" style="${dotStyle}">${inner}</span><span class="mo-label">${mk.name}</span>`;
      el.addEventListener('click', () => {
        tempMark = mk;
        Array.from(grid.children).forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
      });
      grid.appendChild(el);
    });

    // 時間
    buildHourOptions();
    const existingFT = db.freeTimes[selDate] && db.freeTimes[selDate][0];
    if (existingFT) {
      const [sh, sm] = existingFT.start.split(':');
      const [eh, em] = existingFT.end.split(':');
      document.getElementById('sel-start-h').value = sh;
      document.getElementById('sel-start-m').value = sm;
      document.getElementById('sel-end-h').value = eh;
      document.getElementById('sel-end-m').value = em;
    } else {
      document.getElementById('sel-start-h').value = '10';
      document.getElementById('sel-start-m').value = '00';
      document.getElementById('sel-end-h').value = '18';
      document.getElementById('sel-end-m').value = '00';
    }
  }

  function renderFreeTimeList() {
    const container = document.getElementById('ft-overview-list');
    // 当月のキープレフィクス（YYYY-MM）
    const prefix = `${curYear}-${String(curMonth + 1).padStart(2, '0')}`;
    const keys = Object.keys(db.freeTimes)
      .filter(k => k.startsWith(prefix) && db.freeTimes[k] && db.freeTimes[k].length > 0)
      .filter(k => {
        const m = db.marks[k] && db.marks[k][0];
        return m && m.name === '家';
      })
      .sort();

    if (keys.length === 0) {
      container.innerHTML = `<div class="ft-ov-empty">この月の家の予約可能時間はまだ登録されていません</div>`;
      return;
    }

    let html = '';
    keys.forEach(key => {
      const [, mo, d] = key.split('-').map(Number);
      const date = new Date(curYear, mo - 1, d);
      const dow  = date.getDay();
      const isSun = dow === 0;
      const isSat = dow === 6;
      const color = isSun ? 'var(--red)' : isSat ? 'var(--blue)' : 'var(--text)';

      db.freeTimes[key].forEach((ft, i) => {
        html += `
          <div class="ft-row">
            <span class="ft-row-date" style="color:${color}">${d}日(${DAY_NAMES[dow]}):</span><span style="white-space: nowrap;">${ft.start}~${ft.end}</span>
            <span class="ft-del" onclick="deleteFT('${key}',${i})" style="font-size: 13px;">🗑️</span>
          </div>`;
      });
    });
    container.innerHTML = html;
  }

  /* ═══════════════════════════════════════════
     DAY EDIT OPERATIONS
  ═══════════════════════════════════════════ */
  function saveDay() {
    if (tempMark) {
      db.marks[selDate] = [{ id: tempMark.id, color: tempMark.color, name: tempMark.name, icon: tempMark.icon, textColor: tempMark.textColor }];
    } else {
      delete db.marks[selDate];
    }
    
    const sh = document.getElementById('sel-start-h').value;
    const sm = document.getElementById('sel-start-m').value;
    const eh = document.getElementById('sel-end-h').value;
    const em = document.getElementById('sel-end-m').value;
    const s = `${sh}:${sm}`;
    const e = `${eh}:${em}`;
    
    if (s === '00:00' && e === '00:00') {
      delete db.freeTimes[selDate];
    } else if (s >= e) {
      alert('終了時刻は開始時刻より後にしてください');
      return;
    } else {
      db.freeTimes[selDate] = [{ start: s, end: e }];
    }
    
    save();
    renderCalendar();
    renderFreeTimeList();
    closeModal('modal-day');
  }

  function clearDay() {
    delete db.marks[selDate];
    delete db.freeTimes[selDate];
    save();
    renderCalendar();
    renderFreeTimeList();
    closeModal('modal-day');
  }

  function deleteFT(date, idx) {
    if (!db.freeTimes[date]) return;
    delete db.freeTimes[date];
    delete db.marks[date];
    save(); renderCalendar(); renderFreeTimeList();
  }

  function buildHourOptions() {
    const selIds = ['sel-start-h', 'sel-end-h'];
    selIds.forEach(id => {
      const sel = document.getElementById(id);
      sel.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        const opt = document.createElement('option');
        opt.value = String(h).padStart(2, '0');
        opt.textContent = String(h).padStart(2, '0');
        sel.appendChild(opt);
      }
    });
  }

  /* ═══════════════════════════════════════════
     MODAL HELPERS
  ═══════════════════════════════════════════ */
  let _savedScrollY = 0;

  function openModal(id) {
    _savedScrollY = window.scrollY || window.pageYOffset;
    document.body.style.top = `-${_savedScrollY}px`;
    document.getElementById(id).classList.add('open');
    document.body.classList.add('modal-open');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
    document.body.classList.remove('modal-open');
    document.body.style.top = '';
    window.scrollTo(0, _savedScrollY);
  }

  /* ═══════════════════════════════════════════
     EVENT LISTENERS
  ═══════════════════════════════════════════ */
  document.getElementById('btn-prev').addEventListener('click', () => {
    curMonth--;
    if (curMonth < 0) { curMonth = 11; curYear--; }
    renderCalendar();
    renderFreeTimeList();
  });

  document.getElementById('btn-next').addEventListener('click', () => {
    curMonth++;
    if (curMonth > 11) { curMonth = 0; curYear++; }
    renderCalendar();
    renderFreeTimeList();
  });

  document.getElementById('btn-clear-day').addEventListener('click', clearDay);
  document.getElementById('btn-save-day').addEventListener('click', saveDay);
  
  // Close on overlay tap
  ['modal-day'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      if (e.target === document.getElementById(id)) closeModal(id);
    });
  });

  /* ═══════════════════════════════════════════
     INIT
  ═══════════════════════════════════════════ */
  load();
  renderLegend();
  renderCalendar();
  renderFreeTimeList();
</script>
</body>
</html>
